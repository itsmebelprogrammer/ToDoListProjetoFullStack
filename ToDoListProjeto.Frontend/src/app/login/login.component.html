<div class="login-container">
  <mat-card>
    <mat-card-header>
      <mat-card-title>Login</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="login()">
        <mat-form-field appearance="outline">
          <mat-label>Email</mat-label>
          <input matInput type="email" formControlName="email">
          <mat-error *ngIf="form.get('email')?.hasError('required')">O email é obrigatório.</mat-error>
          <mat-error *ngIf="form.get('email')?.hasError('email')">Formato de email inválido.</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Senha</mat-label>
          <input matInput type="password" formControlName="password">
          <mat-error *ngIf="form.get('password')?.hasError('required')">A senha é obrigatória.</mat-error>
        </mat-form-field>

        <button mat-raised-button color="primary" type="submit" [disabled]="form.invalid || isLoading">
          <mat-spinner *ngIf="isLoading" diameter="20" style="display:inline-block;margin-right:8px;"></mat-spinner>
          {{ isLoading ? 'Entrando...' : 'Login' }}
        </button>
        <p *ngIf="errorMessage" class="error-message">{{ errorMessage }}</p>
        <a mat-button routerLink="/register">Não tem uma conta? Registre-se</a>
      </form>
    </mat-card-content>
  </mat-card>
</div>
